<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>HTML Graphics</h1>
  <hr>

  <h3>SVG Line</h3>
  <svg width="200" height="150">
    <line x1="10" y1="10" x2="200" y2="150" stroke="blue" strokewidth="5" />
  </svg>
  <br>

  <h3>SVG Rectangle</h3>
  <svg width="200" height="150">
    <rect x="10" y="10" width="150px" height="100px" rx="10" ry="10" stroke="blue" stroke-width="5" fill="red" />
  </svg>
  <br>

  <h3>SVG Circle</h3>
  <svg width="200" height="150">
    <circle cx="60" cy="60" r="50" stroke="red" stroke-width="5" fill="blue" />
  </svg>
  <br>
  
  <h3>SVG Ellipse</h3>
  <svg width="200" height="100">
    <ellipse cx="80" cy="50" rx="60" ry="40" fill="red" stroke="blue" stroke-width="5" />
  </svg>
  <br>

  <h3>SVG Polyline & Polygon</h3>
  <svg width="200" height="100">
    <polyline points="0,50 100,50 50,100 50,0" fill="none" stroke="red" stroke-width="5" />
  </svg>
 
  <svg width="100" height="100">
    <polygon points="50,0 100,50 50,50 50,100 0,50" fill="blue" stroke="red" stroke-width="5" />
  </svg><br>

  <svg height="210" width="500" xmlns="http://www.w3.org/2000/svg">
    <polygon points="100,10 40,198 190,78 10,78 160,198" style="fill:red;stroke:blue;stroke-width:5;fill-rule:evenodd;"/>
  </svg>
  <br>

  <h3>SVG Path</h3>
  <svg height="50" width="100">
    <path d="M50 0 L25 50 l50 0 Z" fill="blue" stroke="red" strokewidth="5" />
  </svg>
  <br>

  <h3>SVG Text</h3>
  <svg height="50" width="200">
    <text x="20" y="20" fill="red" transform="rotate(10)">Md. Abdul Latif Siyam</text>
  </svg>
  <br>

  <h3>SVG Link</h3>
  <svg height="20" width="100" xmlns:xlink="https://www.isdb.org/">
  <a xlink:href="https://www.isdb-bisew.org/" target="_blank">
  <text x="0" y="10" fill="blue">Click the Link</text>
  </a>
  </svg>
  
  <h3>SVG Stroke</h3>
  <svg width="100" height="100">
    <line x1="10" y1="10" x2="90" y2="10" stroke="red" stroke-width="10" stroke-linecap="butt" />
    <line x1="10" y1="30" x2="90" y2="30" stroke="red" stroke-width="10" stroke-linecap="square" />
    <line x1="10" y1="50" x2="90" y2="50" stroke="red" stroke-width="10" stroke-linecap="round" />
    <line x1="10" y1="70" x2="90" y2="70" stroke="red" stroke-width="10" />
  </svg>
  <br>

  <h3>SVG Linear Gradient</h3>
  <svg height="100" width="200">
    <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="50%">
    <stop offset="0%" stop-color="yellow" />
    <stop offset="50%" stop-color="green" />
    <stop offset="100%" stop-color="red" />
    </linearGradient>
    </defs>
    <rect x="0" y="0" width="150" height="100" fill="url(#grad)" />
  </svg>
  <br>

  <h3>SVG Radial Gradient</h3>
  <svg height="100" width="200">
    <defs>
    <radialGradient id="grads" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
    <stop offset="0%" stop-color="yellow" />
    <stop offset="50%" stop-color="green" />
    <stop offset="100%" stop-color="red" />
    </radialGradient>
    </defs>
    <rect x="0" y="0" width="150" height="100" fill="url(#grads)" />
    </svg>
    <br>

  <h3>SVG Filters</h3>
  <svg height="100" width="200">
    <defs>
    <filter id="my-filter">
    <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
    </filter>
    </defs>
     <rect x="0" y="0" width="150" height="100" fill="green"
    filter="url(#my-filter)" />
  </svg>
</body>
</html>
